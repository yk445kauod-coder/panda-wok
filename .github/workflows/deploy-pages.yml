# Deploy Panda Wok (full SSR) to Cloudflare Pages.
#
# Cloudflare's built-in Pages CI cannot build this project: its Functions
# bundler ignores the project's compatibility_date and fails to resolve bare
# Node builtins inside Next's vendor bundles. This workflow builds on a normal
# runner and ships the result with `wrangler pages deploy`, which works.
#
# Required repository secrets:
#   CLOUDFLARE_API_TOKEN            — Workers/Pages edit
#
# NEXT_PUBLIC_SUPABASE_ANON_KEY is NOT required: it is the publishable key,
# which ships to every browser by design, so the build falls back to it below.
# A repository secret with the same name still overrides the fallback.
# Optional repository variable: CLOUDFLARE_ACCOUNT_ID.

name: Deploy Pages

on:
  workflow_dispatch:
  push:
    branches: [main, production, feature/panda-wok-platform]

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build OpenNext output for Pages
        run: npm run pages:build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://xjbtsryidznsxqlynmfa.supabase.co
          # Publishable key: public by design (ships in the browser bundle).
          # The `||` keeps the build green when the secret is unset — without
          # it, config collection for /api/analytics aborts and no deploy runs.
          NEXT_PUBLIC_SUPABASE_ANON_KEY: >-
            ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY ||
                'sb_publishable_0zVizyDItI9BdiQq667KxA_gnYlTfPX' }}
          NEXT_PUBLIC_SITE_URL: https://panda-wok.pages.dev

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .pages --project-name=panda-wok --branch=production
